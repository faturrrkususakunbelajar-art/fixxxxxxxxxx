<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login | Kedai Digital</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; }
        button { width: 100%; padding: 10px; background: #e67e22; color: white; border: none; cursor: pointer; }
        .info { font-size: 12px; color: #777; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login Admin</h2>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button onclick="alert('Berhasil Login!')">Login</button>
        <div class="info">
            <p>Username: <strong>admin</strong></p>
            <p>Password: <strong>12345</strong></p>
        </div>
    </div>
</body>
</html>
